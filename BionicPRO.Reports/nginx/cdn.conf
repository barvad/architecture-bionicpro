proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=reports_cache:100m 
                 max_size=1g inactive=1h use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # Размеры запросов
    client_max_body_size 100M;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Основной endpoint для отчётов
    location ~ ^/reports/(.*)$ {
        # Кеширование GET запросов
        proxy_cache reports_cache;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 30m;  # Кешировать успешные ответы 30 минут
        proxy_cache_valid 404 1m;   # 404 кешировать 1 минуту
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # Добавляем заголовок о статусе кеша
        add_header X-Cache-Status $upstream_cache_status;

        # Проксируем в Minio
        proxy_pass http://minio:9000/reports/$1;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Authorization "";

        # Таймауты
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
